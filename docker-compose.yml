version: "0.1"
services:
  yt-server:
    build:
      context: ./yt-server
    container_name: yt-server
    ports:
      - "8000:8000"
    networks:
      - backend

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    networks:
      - backend
    environment:
      - GENERIC_TIMEZONE=America/Santiago
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:

networks:
  backend:
